name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The fastest way to get it fixed: in KEF Control open **Settings → App → Copy diagnostics** and paste the result below.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste from Settings → App → Copy diagnostics.
      render: text
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Speaker model
      options: [LSX II LT, LSX II, LS50 Wireless II, LS60 Wireless, XIO, LS LUXE, Other]
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install KEF Control?
      options: [Installer from GitHub, Microsoft Store, winget, From source]
  - type: textarea
    id: more
    attributes:
      label: Anything else?
      description: Screenshots, when it started (for example after a KEF firmware update), etc.
